<article class="project-card" [attr.data-tone]="project.tone">
  <a
    class="project-preview"
    [href]="project.demo"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="'Abrir ' + project.title"
    ><div class="preview-toolbar"
      ><span><i></i><i></i><i></i></span><span>{{ project.title }}</span
      ><span aria-hidden="true"></span></div
    ><img
      loading="lazy"
      [src]="project.picture"
      [alt]="project.pictureAlt"
      width="636"
      height="441"
  /></a>
  <div class="project-content"
    ><div class="project-category"
      ><span>{{ project.category }}</span
      ><span>{{ project.number }}</span></div
    ><h3>{{ project.title }}</h3
    ><p>{{ project.description }}</p
    ><div class="project-tools">
      @for (tool of project.tools; track tool) {
        <span>{{ tool }}</span>
      }</div
    ><div class="project-links"
      ><a [href]="project.demo" target="_blank" rel="noopener noreferrer"
        >Ver projeto</a
      ><a
        [href]="project.github"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'Código do ' + project.title"
        >Ver código</a
      ></div
    ></div
  >
</article>
